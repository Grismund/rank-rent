tool:
  type: epoxy-cost-estimator
  default_slug: "/garage-floor-cost-calculator/"
  inputs:
    - garage_size
    - finish
    - floor_condition
  outputs:
    - sq_ft
    - price_per_sq_ft_range
    - total_range
    - estimated_days

guide_topics:
  - type: cost_guide
    topic: "How much does epoxy flooring cost?"
    target_keyword: "epoxy flooring cost {city}"
  - type: faq
    questions:
      - "How long does epoxy flooring last?"
      - "Can you epoxy a garage floor yourself?"
      - "How long does epoxy take to cure?"
      - "Is epoxy flooring slippery when wet?"
      - "Does epoxy flooring crack?"
      - "Can epoxy be applied over old concrete?"
      - "What is the difference between epoxy and polyaspartic coatings?"
      - "How do you maintain epoxy floors?"
  - type: guide
    topic: "Epoxy vs. Polyaspartic Garage Floors"
    target_keyword: "epoxy vs polyaspartic {city}"
  - type: guide
    topic: "How Long Does an Epoxy Floor Last?"
    target_keyword: "how long does epoxy garage floor last"

design:
  tokens:
    - epoxy-flooring-1
    - epoxy-flooring-2
  image_set: epoxy-flooring

local_variables:
  standard:
    - var: neighborhoods
      research_question: "What are the main neighborhoods and districts in {city}, {state}?"
    - var: permit_requirements
      research_question: "What permits does {city}, {state} require for epoxy flooring or garage floor coating work?"
    - var: local_regulations
      research_question: "What {city}, {state} ordinances regulate VOC emissions or chemical coatings in residential areas?"
    - var: climate_factors
      research_question: "How does the climate in {city}, {state} affect epoxy flooring (e.g. humidity, temperature swings, slab moisture)?"
    - var: nearby_cities
      research_question: "What cities and towns neighbor {city}, {state} that an epoxy flooring contractor would also serve?"
  niche_specific:
    - var: concrete_condition
      research_question: "What is the typical concrete slab condition in {city}, {state} homes — moisture issues, cracks, coatings?"
    - var: humidity_impact
      research_question: "How does humidity in {city}, {state} affect epoxy curing and adhesion?"
    - var: garage_usage
      research_question: "How do homeowners in {city}, {state} typically use their garages — parking, workshop, storage?"
